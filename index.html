<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的日記</title>
    <style>
        :root {
            /* 深橘色與柔和高對比背景，優化閱讀體驗 */
            --bg-color: #fffaf4;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --orange-theme: #a14300; /* 已調深的高對比橘色 */
            --orange-light: #ffdcb8;
            --orange-active: #cd5a00;
            --border-color: #cbd5e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding-bottom: 60px; }
        
        header { background: var(--orange-light); color: var(--orange-theme); padding: 20px; text-align: center; font-weight: bold; font-size: 22px; border-bottom: 2px solid var(--orange-theme); }

        /* 鎖定驗證頁面 */
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .lock-title { font-size: 28px; font-weight: bold; color: var(--orange-theme); margin-bottom: 10px; }
        .pin-input { font-size: 24px; padding: 12px; width: 180px; text-align: center; border-radius: 8px; border: 2px solid var(--orange-theme); margin-top: 15px; outline: none; background: white; }
        .btn-enter { background: var(--orange-theme); color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 20px; cursor: pointer; }
        
        /* 導覽列 */
        .tabs { display: flex; justify-content: space-around; background: white; border-bottom: 1px solid #edf2f7; }
        .tab { flex: 1; text-align: center; padding: 15px 0; cursor: pointer; font-weight: bold; color: #718096; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--orange-theme); border-bottom-color: var(--orange-theme); }

        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; display: none; }
        .container.active { display: block; }

        /* 卡片元件 */
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid var(--orange-light); }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--orange-theme); border-bottom: 2px solid var(--orange-light); padding-bottom: 5px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; margin-top: 12px; color: #4a5568; }
        select, textarea, input[type="text"] { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; outline: none; margin-bottom: 10px; background: #fafafa; }
        select:focus, textarea:focus, input[type="text"]:focus { border-color: var(--orange-active); background: white; }
        textarea { resize: vertical; min-height: 80px; }
        
        /* 想法區塊 */
        .thought-block { background: #fffcf8; border: 1px solid var(--orange-light); padding: 15px; border-radius: 8px; margin-bottom: 12px; }
        .thought-row { display: flex; gap: 10px; align-items: center; }

        /* 滑桿組件 */
        .slider-container { display: flex; align-items: center; gap: 15px; margin-top: 8px; }
        input[type="range"] { flex: 1; accent-color: var(--orange-theme); }
        .slider-val { font-weight: bold; min-width: 45px; text-align: right; color: var(--orange-theme); }

        .dynamic-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .btn-add { background: var(--orange-light); color: var(--orange-theme); border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .btn-del { background: #fed7d7; color: #e53e3e; border: none; padding: 12px; border-radius: 8px; cursor: pointer; }

        /* 情緒網格 */
        .emotion-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .emotion-btn { background: #fafafa; border: 2px solid #e2e8f0; padding: 12px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; font-weight: bold; }
        .emotion-btn.selected { background: #fff8f0; border-color: var(--orange-active); color: var(--orange-theme); }
        .emotion-slider-box { display: none; width: 100%; margin-top: 10px; }
        .emotion-btn.selected .emotion-slider-box { display: block; }

        /* 人體地圖 */
        .bodymap-container { display: flex; justify-content: center; margin: 15px 0; }
        .body-svg { width: 220px; height: auto; }
        .part { fill: #cbd5e0; stroke: #fff; stroke-width: 1.5; cursor: pointer; transition: fill 0.2s; }
        .part.selected { fill: var(--orange-active); }

        .btn-submit { width: 100%; background: var(--orange-theme); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }

        /* 歷史紀錄卡片 */
        .record-card { border-left: 5px solid var(--orange-theme); }
        .record-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .record-details { display: none; margin-top: 15px; border-top: 1px solid #edf2f7; padding-top: 15px; }
        .record-details.open { display: block; }
        .badge { background: #edf2f7; padding: 3px 8px; border-radius: 12px; font-size: 12px; margin-right: 5px; display: inline-block; color: #4a5568; }
        .badge-emotion { background: #fff6ee; color: var(--orange-theme); border: 1px solid var(--orange-light); }

        /* 統計 */
        .stat-card { background: white; padding: 25px; border-radius: 10px; text-align: center; border: 1px solid var(--orange-light); }
        .stat-num { font-size: 32px; font-weight: bold; color: var(--orange-theme); margin-top: 5px; }
        .list-ranking { list-style: none; }
        .list-ranking li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #edf2f7; }

        /* PDF 輸出專用隱藏列印版型 */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; }
            .print-item { page-break-inside: avoid; border-bottom: 2px solid #000; padding: 20px 0; }
        }
    </style>
</head>
<body>

    <!-- 安全密碼驗證畫面 -->
    <div id="lock-screen">
        <div class="lock-title">📖 我的日記</div>
        <p style="color: #5a6578;">請輸入安全個人密碼 (預設: 1234)</p>
        <input type="password" id="pin-field" class="pin-input" placeholder="請輸入密碼" maxlength="4">
        <button class="btn-enter" onclick="verifyPIN()">確定進入</button>
    </div>

    <header>📖 我的日記</header>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('new-record')">新建記錄</div>
        <div class="tab" onclick="switchTab('my-records'); renderRecords();">我的日記</div>
        <div class="tab" onclick="switchTab('insights'); renderInsights();">數據洞察</div>
    </div>

    <!-- 1. 新建日記表單 -->
    <div id="new-record" class="container active">
        <div class="card">
            <div class="card-title">📍 當前位置</div>
            <select id="location-select" onchange="toggleCustomLoc()">
                <option value="家中">家中</option>
                <option value="醫院">醫院</option>
                <option value="學校">學校</option>
                <option value="戶外">戶外</option>
                <option value="其他">其他 (請於下方輸入)</option>
            </select>
            <input type="text" id="custom-location" style="display:none;" placeholder="請輸入具體地點...">
        </div>

        <div class="card">
            <div class="card-title">📌 情境事件</div>
            <label>當時發生了什麼事？(請客觀描述事實)</label>
            <textarea id="event-text" placeholder="例如：在開會報告時，主管打斷了我的發言..."></textarea>
        </div>

        <div class="card">
            <div class="card-title">💭 想法</div>
            <label>當時腦海裡浮現出什麼想法？並評估每個想法的相信程度：</label>
            <div id="thoughts-container">
                <div class="thought-block">
                    <div class="thought-row">
                        <input type="text" class="thought-input" placeholder="想法內容...">
                    </div>
                    <div class="slider-container">
                        <span style="font-size: 14px; color:#4a5568;">相信程度：</span>
                        <input type="range" class="belief-intensity" min="0" max="100" value="50" oninput="updateSliderText(this)">
                        <span class="slider-val">50%</span>
                    </div>
                </div>
            </div>
            <button class="btn-add" onclick="addThoughtField()">＋ 新增想法</button>
        </div>

        <div class="card">
            <div class="card-title">😊😔 當下情緒</div>
            <label>你留意到什麼情緒？選取所有符合當下的情緒並評估強度：</label>
            <div class="emotion-grid" id="emotion-grid-container">
                <div class="emotion-btn" onclick="toggleEmotion(this)">
                    <span>焦慮 😰</span>
                    <div class="emotion-slider-box" onclick="event.stopPropagation()">
                        <div class="slider-container">
                            <input type="range" class="emotion-slider" min="0" max="100" value="50" oninput="updateSliderText(this)">
                            <span class="slider-val">50%</span>
                        </div>
                    </div>
                </div>
                <div class="emotion-btn" onclick="toggleEmotion(this)">
                    <span>傷心 😢</span>
                    <div class="emotion-slider-box" onclick="event.stopPropagation()">
                        <div class="slider-container">
                            <input type="range" class="emotion-slider" min="0" max="100" value="50" oninput="updateSliderText(this)">
                            <span class="slider-val">50%</span>
                        </div>
                    </div>
                </div>
                <div class="emotion-btn" onclick="toggleEmotion(this)">
                    <span>生氣 😠</span>
                    <div class="emotion-slider-box" onclick="event.stopPropagation()">
                        <div class="slider-container">
                            <input type="range" class="emotion-slider" min="0" max="100" value="50" oninput="updateSliderText(this)">
                            <span class="slider-val">50%</span>
                        </div>
                    </div>
                </div>
                <div class="emotion-btn" onclick="toggleEmotion(this)">
                    <span>平靜 😌</span>
                    <div class="emotion-slider-box" onclick="event.stopPropagation()">
                        <div class="slider-container">
                            <input type="range" class="emotion-slider" min="0" max="100" value="50" oninput="updateSliderText(this)">
                            <span class="slider-val">50%</span>
                        </div>
                    </div>
                </div>
                <div class="emotion-btn" onclick="toggleEmotion(this)">
                    <span>快樂 😊</span>
                    <div class="emotion-slider-box" onclick="event.stopPropagation()">
                        <div class="slider-container">
                            <input type="range" class="emotion-slider" min="0" max="100" value="50" oninput="updateSliderText(this)">
                            <span class="slider-val">50%</span>
                        </div>
                    </div>
                </div>
                <div class="emotion-btn" onclick="toggleEmotion(this)">
                    <span>抱有希望 🙂</span>
                    <div class="emotion-slider-box" onclick="event.stopPropagation()">
                        <div class="slider-container">
                            <input type="range" class="emotion-slider" min="0" max="100" value="50" oninput="updateSliderText(this)">
                            <span class="slider-val">50%</span>
                        </div>
                    </div>
                </div>
            </div>
            <button class="btn-add" style="margin-top: 15px; width: 100%;" onclick="addUserEmotion()">＋ 新增自訂情緒</button>
        </div>

        <div class="card">
            <div class="card-title">💆🏻 身體感覺</div>
            <label>你留意到身體有什麼感覺？點擊人體圖的不同部位以反映你的感覺：</label>
            <div class="bodymap-container">
                <svg class="body-svg" viewBox="0 0 200 400">
                    <circle id="part-頭部" class="part" cx="100" cy="40" r="22"/>
                    <rect id="part-頸部" class="part" x="93" y="65" width="14" height="12" rx="2"/>
                    <path id="part-左肩" class="part" d="M70,78 C80,76 90,78 93,80 L88,95 L65,92 Z"/>
                    <path id="part-右肩" class="part" d="M130,78 C120,76 110,78 107,80 L112,95 L135,92 Z"/>
                    <rect id="part-胸口" class="part" x="80" y="85" width="40" height="40" rx="3"/>
                    <rect id="part-上腹部" class="part" x="82" y="128" width="36" height="30"/>
                    <rect id="part-骨盆腹下" class="part" x="80" y="161" width="40" height="25" rx="5"/>
                    <path id="part-左臂" class="part" d="M62,95 L75,97 L65,160 L52,155 Z"/>
                    <path id="part-右臂" class="part" d="M138,95 L125,97 L135,160 L148,155 Z"/>
                    <path id="part-左腿" class="part" d="M82,188 L98,188 L95,290 L78,290 Z"/>
                    <path id="part-右腿" class="part" d="M102,188 L118,188 L122,290 L105,290 Z"/>
                    <rect id="part-左腳" class="part" x="73" y="293" width="22" height="12" rx="4"/>
                    <rect id="part-右腳" class="part" x="105" y="293" width="22" height="12" rx="4"/>
                </svg>
            </div>
            <label>具體身體感知描述：</label>
            <textarea id="physical-text" placeholder="請寫下身體感受..."></textarea>
        </div>

        <div class="card">
            <div class="card-title">🎯 行為與應對</div>
            <label>你當時做了什麼來應對？(可新增多項)</label>
            <div id="coping-container">
                <div class="dynamic-row">
                    <input type="text" class="coping-input" placeholder="例如：深呼吸、離開現場...">
                </div>
            </div>
            <button class="btn-add" onclick="addCopingField()">＋ 新增應對方式</button>
        </div>

        <div class="card">
            <div class="card-title">🤚 停一停：我有其他備注嗎？ 📝</div>
            <label>任何其他觀察：</label>
            <textarea id="notes-text" placeholder="請寫下任何補充...(例如：有什麼證據支持和反對這個想法？有什麼其他角度看待這件事？🕵️）"></textarea>
        </div>

        <button class="btn-submit" onclick="saveRecord()">儲存今日日記</button>
    </div>

    <!-- 2. 歷史記錄查看頁 -->
    <div id="my-records" class="container">
        <!-- 匯出成 PDF/列印 按鈕 -->
        <button class="btn-submit" style="margin-bottom: 20px; background: #2b6cb0;" onclick="exportAllToPDF()">📄 匯出全部日記為 PDF</button>
        <div id="records-list"></div>
    </div>

    <!-- 3. 數據統計面版 -->
    <div id="insights" class="container">
        <div class="stat-card">
            <div>總日記篇數</div>
            <div class="stat-num" id="stat-total-records">0</div>
        </div>
        <div class="card" style="margin-top:20px;">
            <div class="card-title">🛠️ 常用應對策略</div>
            <ul id="stat-coping" class="list-ranking"></ul>
        </div>
    </div>

    <!-- 隱藏的 PDF 列印渲染區 -->
    <div id="print-area"></div>

    <script>
        // 驗證 PIN 密碼功能
        function verifyPIN() {
            const pinField = document.getElementById('pin-field');
            if (pinField && pinField.value === '1234') {
                document.getElementById('lock-screen').style.display = 'none';
            } else {
                alert('密碼錯誤，請再試一次。');
                if(pinField) pinField.value = '';
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(event && event.target) event.target.classList.add('active');
        }

        function updateSliderText(slider) {
            slider.nextElementSibling.innerText = slider.value + '%';
        }

        function toggleCustomLoc() {
            const select = document.getElementById('location-select');
            const customInput = document.getElementById('custom-location');
            customInput.style.display = (select.value === '其他') ? 'block' : 'none';
        }

        function addThoughtField() {
            const container = document.getElementById('thoughts-container');
            const div = document.createElement('div');
            div.className = 'thought-block';
            div.innerHTML = `
                <div class="thought-row">
                    <input type="text" class="thought-input" placeholder="想法內容...">
                    <button class="btn-del" style="padding: 6px 12px; margin-bottom: 10px;" onclick="this.parentElement.parentElement.remove()">✕</button>
                </div>
                <div class="slider-container">
                    <span style="font-size: 14px; color:#4a5568;">相信程度：</span>
                    <input type="range" class="belief-intensity" min="0" max="100" value="50" oninput="updateSliderText(this)">
                    <span class="slider-val">50%</span>
                </div>
            `;
            container.appendChild(div);
        }

        function addUserEmotion() {
            const customName = prompt('請輸入你想記錄的情緒名稱：');
            if (!customName || customName.trim() === "") return;
            const container = document.getElementById('emotion-grid-container');
            const div = document.createElement('div');
            div.className = 'emotion-btn';
            div.onclick = function() { toggleEmotion(this); };
            div.innerHTML = `
                <span>${customName.trim()} ✨</span>
                <div class="emotion-slider-box" onclick="event.stopPropagation()">
                    <div class="slider-container">
                        <input type="range" class="emotion-slider" min="0" max="100" value="50" oninput="updateSliderText(this)">
                        <span class="slider-val">50%</span>
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function addCopingField() {
            const container = document.getElementById('coping-container');
            const div = document.createElement('div');
            div.className = 'dynamic-row';
            div.innerHTML = `<input type="text" class="coping-input" placeholder="應對方式..."><button class="btn-del" onclick="this.parentElement.remove()">✕</button>`;
            container.appendChild(div);
        }

        function toggleEmotion(btn) {
            btn.classList.toggle('selected');
        }

        document.querySelectorAll('.part').forEach(part => {
            part.addEventListener('click', () => part.classList.toggle('selected'));
        });

        // 儲存邏輯
        function saveRecord() {
            const locSelect = document.getElementById('location-select').value;
            const finalLocation = locSelect === '其他' ? document.getElementById('custom-location').value : locSelect;
            
            const thoughtsArray = [];
            document.querySelectorAll('.thought-block').forEach(block => {
                const textVal = block.querySelector('.thought-input').value;
                if(textVal) {
                    const sliderVal = block.querySelector('.belief-intensity').value;
                    thoughtsArray.push({ text: textVal, belief: parseInt(sliderVal) });
                }
            });

            const coping = Array.from(document.querySelectorAll('.coping-input')).map(i => i.value).filter(v => v);
            const selectedEmotions = [];
            document.querySelectorAll('.emotion-btn.selected').forEach(btn => {
                const name = btn.querySelector('span').innerText;
                const intensity = btn.querySelector('.emotion-slider').value;
                selectedEmotions.push({ name, intensity: parseInt(intensity) });
            });

            const selectedBodyParts = Array.from(document.querySelectorAll('.part.selected')).map(p => p.id.replace('part-', ''));

            const record = {
                id: Date.now(),
                date: new Date().toLocaleString('zh-HK'),
                location: finalLocation || '未指定地點',
                event: document.getElementById('event-text').value,
                thoughts: thoughtsArray,
                emotions: selectedEmotions,
                bodyParts: selectedBodyParts,
                physicalText: document.getElementById('physical-text').value,
                coping: coping,
                notes: document.getElementById('notes-text').value
            };

            let records = JSON.parse(localStorage.getItem('cbt_records')) || [];
            records.unshift(record);
            localStorage.setItem('cbt_records', JSON.stringify(records));

            alert('日記已成功安全儲存！');
            resetForm();
            switchTab('my-records');
            renderRecords();
        }

        function resetForm() {
            document.getElementById('event-text').value = '';
            document.getElementById('physical-text').value = '';
            document.getElementById('notes-text').value = '';
            document.getElementById('custom-location').value = '';
            document.getElementById('location-select').selectedIndex = 0;
            document.getElementById('thoughts-container').innerHTML = `
                <div class="thought-block">
                    <div class="thought-row"><input type="text" class="thought-input" placeholder="想法內容..."></div>
                    <div class="slider-container">
                        <span>相信程度：</span>
                        <input type="range" class="belief-intensity" min="0" max="100" value="50" oninput="updateSliderText(this)">
                        <span class="slider-val">50%</span>
                    </div>
                </div>`;
            document.getElementById('coping-container').innerHTML = `<div class="dynamic-row"><input type="text" class="coping-input" placeholder="例如：深呼吸、離開現場..."></div>`;
            document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('selected'));
            document.querySelectorAll('.part').forEach(p => p.classList.remove('selected'));
        }

        // 渲染歷史日誌面板
        function renderRecords() {
            const list = document.getElementById('records-list');
            const records = JSON.parse(localStorage.getItem('cbt_records')) || [];
            
            if(records.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#a0aec0; margin-top:20px;">尚無任何日記記錄。</p>';
                return;
            }

            list.innerHTML = records.map(r => `
                <div class="card record-card">
                    <div class="record-header" onclick="this.nextElementSibling.classList.toggle('open')">
                        <div>
                            <strong>${r.date}</strong> <span class="badge">${r.location}</span>
                            <div style="margin-top:5px; font-size:14px; color:#4a5568;">事件概要: ${r.event.substring(0,25)}...</div>
                        </div>
                        <span style="color:var(--orange-theme); font-size:14px;">展開 ▾</span>
                    </div>
                    <div class="record-details">
                        <p><strong>💭 想法與相信程度:</strong></p>
                        <ul>${r.thoughts.map(t => `<li>${t.text} (${t.belief}%)</li>`).join('')}</ul>
                        <p style="margin-top:10px;"><strong>😊 觀察到的情緒:</strong></p>
                        <div>${r.emotions.map(e => `<span class="badge badge-emotion">${e.name}: ${e.intensity}%</span>`).join('')}</div>
                        <p style="margin-top:10px;"><strong>💆🏻 身體反應:</strong></p>
                        <div>部位: ${r.bodyParts.join(', ') || '無'} | 細節: ${r.physicalText || '無'}</div>
                        <p style="margin-top:10px;"><strong>🎯 應對措施:</strong></p>
                        <ul>${r.coping.map(c => `<li>${c}</li>`).join('')}</ul>
                        ${r.notes ? `<p style="margin-top:10px;"><strong>📝 其他備注:</strong></p><p>${r.notes}</p>` : ''}
                        <button class="btn-del" style="margin-top:15px; padding:6px 12px; font-size:12px;" onclick="deleteRecord(${r.id})">刪除日記</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteRecord(id) {
            if(confirm('確定要永久刪除這篇日記嗎？')) {
                let records = JSON.parse(localStorage.getItem('cbt_records')) || [];
                records = records.filter(r => r.id !== id);
                localStorage.setItem('cbt_records', JSON.stringify(records));
                renderRecords();
            }
        }

        // 產生完整匯出結構並觸發 PDF 列印機制
        function exportAllToPDF() {
            const records = JSON.parse(localStorage.getItem('cbt_records')) || [];
            if(records.length === 0) {
                alert('沒有可供匯出的日記數據。');
                return;
            }
            
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = `<h1>📖 我的日記 - 完整回顧報告</h1>` + records.map(r => `
                <div class="print-item">
                    <h2>日期時間：${r.date} | 地點：${r.location}</h2>
                    <p><strong>情境事件：</strong>${r.event || '無'}</p>
                    <p><strong>想法與相信程度：</strong></p>
                    <ul>${r.thoughts.map(t => `<li>${t.text} (${t.belief}%)</li>`).join('')}</ul>
                    <p><strong>觀察到的情緒強度：</strong></p>
                    <p>${r.emotions.map(e => `${e.name}: ${e.intensity}%`).join(' / ') || '無'}</p>
                    <p><strong>身體感覺反映部位：</strong>${r.bodyParts.join(', ') || '無'}</p>
                    <p><strong>身體感覺描述：</strong>${r.physicalText || '無'}</p>
                    <p><strong>採取應對措施：</strong>${r.coping.join('、') || '無'}</p>
                    ${r.notes ? `<p><strong>其他備注：</strong>${r.notes}</p>` : ''}
                </div>
            `).join('');
            
            window.print();
        }

        function renderInsights() {
            const records = JSON.parse(localStorage.getItem('cbt_records')) || [];
            document.getElementById('stat-total-records').innerText = records.length;

            if(records.length === 0) {
                document.getElementById('stat-coping').innerHTML = '<li>尚無數據</li>';
                return;
            }

            const copingCounts = {};
            records.forEach(r => r.coping.forEach(c => copingCounts[c] = (copingCounts[c] || 0) + 1));
            const sortedCoping = Object.entries(copingCounts).sort((a,b) => b[1] - a[1]).slice(0, 5);
            document.getElementById('stat-coping').innerHTML = sortedCoping.map(([tool, count]) => `<li><span>${tool}</span><strong>${count} 次</strong></li>`).join('') || '<li>無應對數據</li>';
        }
    </script>
</body>
</html>
